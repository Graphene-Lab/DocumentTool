name: Publish NuGet Package

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # PreRelease gate: a push whose code carries IsPrerelease=true gets a "-prerelease" version
  # suffix and publishes NOTHING — a plain push/sync is a code-only update (no NuGet package,
  # no GitHub release). Set IsPrerelease=false in the csproj for a real release push. Same rule
  # as AgentBridge's release.yml (see github-push-and-release.md).
  check-version:
    runs-on: ubuntu-latest
    outputs:
      do_publish: ${{ steps.gate.outputs.do_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release gate
        id: gate
        shell: bash
        run: |
          VER=$(dotnet msbuild DocumentTool.csproj -getProperty:Version -nologo | grep -oE '[0-9]+(\.[0-9]+)*(-[a-z0-9]+)?' | head -n1)
          if [[ "$VER" == *-prerelease* ]]; then
            echo "IsPrerelease=true -> prerelease push, code-only (no NuGet publish)"
            echo "do_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "do_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.do_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            dotnet pack DocumentTool.csproj -c Release -o ./out -p:SkipNuGetPush=true -p:RestoreForce=true && break
            echo "retry $i (waiting for dependency packages on nuget.org)..."
            sleep 60
          done
          test -n "$(ls ./out/*.nupkg 2>/dev/null)"
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set on this repository — the package was NOT published. Add the secret (Settings -> Secrets and variables -> Actions, same key as the other Graphene-Lab repos) and re-run this job."
            exit 1
          fi
          dotnet nuget push ./out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
